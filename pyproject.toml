[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-lab"
version = "2.0.0"
description = "Windows-first digital-forensics laboratory core"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexus-core = "nexus_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

